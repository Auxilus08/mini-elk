server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routing (if any is ever added) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for fingerprinted assets, no-cache for index.html.
    location ~* \.(?:js|css|woff2|svg|png|jpg|gif|ico)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
