x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SCENARIO_STATE_FILE: /shared/scenario.json
  PROFILES_PATH: /app/sim_profiles.yaml
  PYTHONUNBUFFERED: "1"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      <<: *service-env
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./sim_profiles.yaml:/app/sim_profiles.yaml:ro
      - ./shared-state:/shared
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVICE_NAME: auth-service
    volumes:
      - ./sim_profiles.yaml:/app/sim_profiles.yaml:ro
      - ./shared-state:/shared
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVICE_NAME: api-gateway
    volumes:
      - ./sim_profiles.yaml:/app/sim_profiles.yaml:ro
      - ./shared-state:/shared
    restart: unless-stopped

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVICE_NAME: worker-service
    volumes:
      - ./sim_profiles.yaml:/app/sim_profiles.yaml:ro
      - ./shared-state:/shared
    restart: unless-stopped

  search-api:
    build:
      context: ./search-api
      dockerfile: Dockerfile
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      SEARCH_API_ES_HOST: http://elasticsearch:9200
      SEARCH_API_LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Vite bakes these into the static bundle at build time. The browser
        # loads from the host, so the API URL must be the host-exposed port
        # (not the docker-network DNS name).
        VITE_API_BASE_URL: http://localhost:8000
        VITE_TRANSPORT: poll
        VITE_POLL_INTERVAL_MS: "5000"
    depends_on:
      - search-api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  es-data:

